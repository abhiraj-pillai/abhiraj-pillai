<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- James Bond -->
  <defs>
    <radialGradient id="bond-bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bond-bg)" stroke="#c9a961" stroke-width="3"/>
  <!-- Face -->
  <ellipse cx="100" cy="88" rx="40" ry="46" fill="#e8c89e"/>
  <!-- Slicked back dark hair -->
  <path d="M 60 72 Q 62 38 100 35 Q 138 38 140 72 L 140 65 Q 138 42 100 38 Q 62 42 60 65 Z" fill="#222"/>
  <path d="M 58 72 Q 55 60 62 50" fill="#222"/>
  <path d="M 142 72 Q 145 60 138 50" fill="#222"/>
  <!-- Suave eyebrows - slightly raised -->
  <path d="M 70 72 Q 82 66 92 72" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <path d="M 108 72 Q 118 66 130 72" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes - confident, half-lidded -->
  <ellipse cx="82" cy="82" rx="10" ry="8" fill="white" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="118" cy="82" rx="10" ry="8" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Blue eyes -->
  <circle cx="83" cy="82" r="5" fill="#4a86c8"/>
  <circle cx="119" cy="82" r="5" fill="#4a86c8"/>
  <circle cx="83" cy="82" r="2.5" fill="#1a3a5c"/>
  <circle cx="119" cy="82" r="2.5" fill="#1a3a5c"/>
  <!-- Slight smirk -->
  <path d="M 85 108 Q 100 116 118 106" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Defined jaw -->
  <path d="M 60 92 Q 58 115 80 130 Q 100 138 120 130 Q 142 115 140 92" fill="none" stroke="#d4a878" stroke-width="1"/>
  <!-- Black tuxedo -->
  <rect x="62" y="135" width="76" height="45" rx="6" fill="#111"/>
  <!-- White shirt -->
  <rect x="88" y="135" width="24" height="45" fill="white"/>
  <!-- Black bow tie -->
  <polygon points="93,142 100,146 107,142 107,148 100,144 93,148" fill="#111"/>
  <!-- Tuxedo lapels -->
  <path d="M 88 135 L 78 160" stroke="#222" stroke-width="2"/>
  <path d="M 112 135 L 122 160" stroke="#222" stroke-width="2"/>
</svg>
