<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Morty Smith -->
  <defs>
    <radialGradient id="morty-bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#c4a535"/>
      <stop offset="100%" stop-color="#2d7a3a"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#morty-bg)" stroke="#d4b545" stroke-width="3"/>
  <!-- Round head -->
  <ellipse cx="100" cy="88" rx="48" ry="50" fill="#fdd9b5"/>
  <!-- Curly brown hair -->
  <ellipse cx="100" cy="55" rx="45" ry="22" fill="#8B6914"/>
  <circle cx="65" cy="60" r="12" fill="#8B6914"/>
  <circle cx="135" cy="60" r="12" fill="#8B6914"/>
  <circle cx="80" cy="48" r="10" fill="#8B6914"/>
  <circle cx="120" cy="48" r="10" fill="#8B6914"/>
  <circle cx="100" cy="42" r="11" fill="#8B6914"/>
  <!-- Eyes - wide and worried -->
  <ellipse cx="82" cy="85" rx="12" ry="14" fill="white" stroke="#333" stroke-width="2"/>
  <ellipse cx="118" cy="85" rx="12" ry="14" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Pupils - small, looking nervous -->
  <circle cx="84" cy="87" r="5" fill="#333"/>
  <circle cx="120" cy="87" r="5" fill="#333"/>
  <!-- Worried eyebrows -->
  <line x1="72" y1="68" x2="88" y2="72" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="68" x2="112" y2="72" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Small worried mouth -->
  <path d="M 90 112 Q 100 108 110 112" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Yellow t-shirt -->
  <rect x="68" y="138" width="64" height="40" rx="8" fill="#f0d000"/>
</svg>
