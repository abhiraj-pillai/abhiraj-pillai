<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Homer Simpson -->
  <defs>
    <radialGradient id="homer-bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f0c000"/>
      <stop offset="100%" stop-color="#d48a00"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#homer-bg)" stroke="#f0d000" stroke-width="3"/>
  <!-- Homer's yellow head - rounded rectangle shape -->
  <ellipse cx="100" cy="88" rx="48" ry="52" fill="#ffd700"/>
  <!-- Bald head - two hairs -->
  <path d="M 88 42 Q 85 28 92 38" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 95 40 Q 92 26 99 36" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Side hair/ear area -->
  <path d="M 55 75 Q 48 85 52 100 Q 48 85 55 75" fill="#333"/>
  <!-- Big round eyes -->
  <circle cx="82" cy="78" r="16" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="114" cy="78" r="16" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Pupils -->
  <circle cx="85" cy="80" r="4" fill="#333"/>
  <circle cx="117" cy="80" r="4" fill="#333"/>
  <!-- Big nose -->
  <ellipse cx="100" cy="96" rx="10" ry="8" fill="#f0c000" stroke="#e0b000" stroke-width="1"/>
  <!-- Big mouth opening - donut eating -->
  <ellipse cx="100" cy="118" rx="22" ry="14" fill="#8B3030"/>
  <path d="M 78 115 Q 100 108 122 115" fill="#ffd700"/>
  <!-- 5 o'clock shadow -->
  <ellipse cx="100" cy="125" rx="30" ry="18" fill="none" stroke="#e0b800" stroke-width="1" stroke-dasharray="2,3"/>
  <!-- White shirt -->
  <rect x="68" y="140" width="64" height="40" rx="8" fill="white"/>
  <!-- Collar -->
  <path d="M 88 140 L 100 155 L 112 140" fill="none" stroke="#ddd" stroke-width="2"/>
</svg>
